# The smallest config that does something useful: one application, one database,
# one account. Start here and add to it.
#
# Check it before you use it:
#     sopuli --config single-application.yaml config validate
#
# Full reference: ../docs/design/01-configuration.md
# First run:      ../docs/getting-started.md

# The editor hint below gives you completion and inline errors in VS Code and
# anything else that speaks the YAML language server. It is optional.
# yaml-language-server: $schema=../docs/schemas/sopuli-config-1.7.schema.json

version: 1

# ---------------------------------------------------------------------------
# Where secrets live. A "vault" is a server built to store secrets and hand
# them out. Every store this file may use is named here, and nowhere else.
# ---------------------------------------------------------------------------
vaults:
  vault-dev:
    type: hashicorp
    addr: http://127.0.0.1:8200
    # A HashiCorp Vault keeps secrets under a named "mount". `kv` is the usual
    # name for the key-value store; version 2 is the one that keeps history.
    mount: kv
    kv_version: 2
    # How to log in to the vault. `token` reads the token from the environment
    # (VAULT_TOKEN) or from ~/.vault-token. No secret is ever written here.
    auth: { method: token }

# ---------------------------------------------------------------------------
# Settings the rest of the file inherits unless it says otherwise.
# ---------------------------------------------------------------------------
defaults:
  vault: vault-dev

# ---------------------------------------------------------------------------
# Which databases this file is allowed to touch. One entry per endpoint.
# The tool will not connect to a database that is not listed here.
# ---------------------------------------------------------------------------
targets:
  - name: free-pdb
    type: oracle
    # A free-text label for the environment. It is what `confirm_environments`
    # in safety-hardened.yaml matches on.
    environment: dev
    dsn: "127.0.0.1:1521/FREEPDB1"
    # How the tool logs in as an administrator. `method: env` means the
    # password comes from the SOPULI_DB_ADMIN_PASSWORD environment variable.
    # There is no way to write a password in this file, by design.
    admin: { username: SYSTEM, auth: { method: env } }
    # An assertion, not a setting: the tool checks on connect that it really
    # landed in the pluggable database named here, and refuses if it did not.
    oracle: { scope: pdb, container: FREEPDB1 }

# ---------------------------------------------------------------------------
# What a generated password has to look like.
# ---------------------------------------------------------------------------
policies:
  standard:
    password:
      length: 24
      # `alnum_safe` is letters and digits plus a few punctuation characters
      # that survive shells, connection strings and Oracle quoting.
      charset: alnum_safe
      # Oracle identifiers may not start with a digit.
      first_char: alpha
      require: { upper: 1, lower: 1, digit: 1, special: 1 }

# ---------------------------------------------------------------------------
# The application. With only one, its keys sit at the top level like this.
# Two or more, and they move into an `applications:` list -- see
# multiple-applications.yaml.
# ---------------------------------------------------------------------------

# The accounts this file manages. This list is a whitelist: the tool never
# touches an account that is not on it. Command-line options can narrow the
# list; nothing can extend it, not even --force.
accounts:
  - acme_app_user

# Where each account's password is mastered, in three pieces:
#   vault-dev:          which store, from `vaults:` above
#   acme/{env}/db       the path to a document inside it
#   #DB_CREDENTIALS/... the field inside that document
# {env} and {account} are filled in per target and per account, so one line
# covers an estate. Here it resolves to the document `acme/dev/db`, field
# `DB_CREDENTIALS/acme_app_user`.
secret_template: "vault-dev:acme/{env}/db#DB_CREDENTIALS/{account}"

policy: standard
