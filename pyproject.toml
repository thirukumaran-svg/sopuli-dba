[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sopuli-dba"
# Seeded at 0.0.0 to match .release-please-manifest.json. release-please owns
# this field from here on — do not bump it by hand (docs/workflow.md).
version = "0.65.0"
description = "Manage database account credentials with a vault as the master record"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["oracle", "dba", "credentials", "vault", "rotation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  # P4's config permission check needs the file's DACL, and os.stat() cannot
  # see it -- st_mode is 0o666 for essentially every file on Windows. See
  # docs/decisions/adr-004-yaml-parser.md.
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# ADR-006: every dependency that exists only to reach one vendor is an extra, and
# base opens no sockets. The floors below are floors, not a tested matrix -- each
# one is the oldest release known to carry the API the backend uses, and the
# tested version is whatever CI resolves.
oracle = [
  # D3: thick mode, because thin mode has no Native Network Encryption and
  # OCI-hosted databases require it. Instant Client is a runtime prerequisite
  # either way, which is why reaching Oracle was already a per-site condition
  # before this extra named it.
  #
  # `oracledb`, not `python-oracledb`. Oracle calls the driver python-oracledb
  # everywhere it is written about -- the docs, the release notes, this
  # project's own design documents -- but the distribution on PyPI and the
  # module you import are both `oracledb`, and the other name resolves to
  # nothing at all. Keep the prose name in prose.
  "oracledb>=2.0",
]
hashicorp = [
  # ADR-005 (E2): the HTTP API directly, no `hvac`. `httpx` rather than
  # `requests` for explicit default timeouts and a real SSLContext, and here
  # rather than in base because a third-party HTTP client in base is exactly
  # what rule 3 is a test for.
  "httpx>=0.27",
]
oci = [
  # ADR-005: the SDK stays, because request signing and principal federation are
  # not "HTTP plus a bearer token". It pins `cryptography` and `pyOpenSSL` and
  # vendors its own `requests`, which is the concrete reason a site without OCI
  # should not inherit it.
  "oci>=2.126",
]
notify = [
  # E7 (#442): UC-2's notify channel posts to a webhook, and a channel that opens
  # a socket is an extra like any other. `httpx` again, and the duplication with
  # `hashicorp` is deliberate -- rule 3 names the installed dependency set, so an
  # estate that has httpx for one reason has it for both, and one that has it for
  # neither is the case a base install defends.
  #
  # **Its own name rather than folding into `hashicorp`**, which was the
  # alternative and is why this is a fourth category rather than a reuse: an
  # estate on OCI Vault installing a HashiCorp extra in order to post a chat
  # message would make the extra's name stop meaning why the dependency is there,
  # which is the property ADR-006 exists to keep real.
  #
  # A future `smtp` channel adds nothing here: the standard library sends mail.
  "httpx>=0.27",
]
# E3: `all` exists because CI and the test matrix need one name that means
# everything. It is deliberately not what README recommends -- an install line
# that reads `sopuli[all]` undoes the split for every reader who copies it.
all = [
  "sopuli-dba[oracle,hashicorp,oci,notify]",
]

dev = [
  "pytest>=8.0",
  "jsonschema>=4.20",
  "types-jsonschema>=4.20",
  "types-pyyaml>=6.0",
  # Stubs are platform-independent, so mypy checks the Windows-only branch of
  # config/permissions.py on Linux too.
  "types-pywin32>=306",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
# D1: the binary is `sopuli`; the distribution is `sopuli-dba`.
sopuli = "sopuli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sopuli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `ruff format .` would otherwise rewrite Python snippets inside the design
# documents, and the draft sketch in `test/` — which is the container test
# stack (compose, init SQL), not this project's unit tests. Those live in
# `tests/`. Both are out of scope for the formatter until they become real code.
extend-exclude = ["docs", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# `oracledb` is an extra (ADR-006), so it is absent from a base checkout and the
# tier-1 fixture that imports it must still typecheck there. The import is inside
# a function and guarded, which is the rule this override serves rather than
# weakens: nothing at module scope reaches for a vendor client.
[[tool.mypy.overrides]]
module = ["oracledb"]
ignore_missing_imports = true
