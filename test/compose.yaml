# sopuli-dba test stack
#
# STATUS: tier0 and tier1 verified working 2026-08-17. tier2, nne and emulators are
# still unrun and their image tags unverified — see docs/design/04-testing.md §8 T1.
#
# Profiles keep the inner loop fast, and they are additive: every tier0 service also
# carries tier1 and tier2, so moving up a tier adds services and recreates nothing.
#   docker compose --profile tier0 up -d     # Vault + PostgreSQL, seconds
#   docker compose --profile tier1 up -d     # + Oracle Free, ~30-60 s to healthy
#   docker compose --profile tier2 up -d     # + older Oracle lines, several minutes
#   docker compose --profile nne   up -d     # Oracle with Native Network Encryption required
#   docker compose --profile oracle19c up -d # 19.3 EE, maintainer-only; see the service
#   docker compose --profile oracle19c-ru up -d # 19.19 EE, arm64 hosts only
#   docker compose --profile oracle12c up -d # 12.2.0.1 EE, maintainer-only
#
# TEARDOWN: use `docker compose --profile '*' down`. A plain `docker compose down` is
# a SILENT NO-OP here — every service below carries a profiles: key, so with no
# profile selected it matches nothing and exits 0. `--profile tier0 down` is worse
# than useless: it removes tier0's services, leaves Oracle running, and then cannot
# remove the network. See README.md.
#
# PORTS are published on loopback only, 127.0.0.1 and ::1. README.md says why.
#
# Oracle containers are deliberately long-running: tests reset state by dropping and
# recreating accounts, never by recreating the container. Note that NOTHING HERE
# ENFORCES THAT — no service but the two 19c ones and 12.2 declares a volume, so
# any teardown discards the database and the next `up` re-initialises from
# scratch. oracle-19c and oracle-19c-ru keep their datafiles in named volumes
# because their first start takes tens of minutes, and oracle-12c because its
# one-time init lives in them; `down -v` is the one form that discards them.
#
# A SECOND CLONE can run its own tier0/tier1 stack beside this one. Set
# COMPOSE_PROJECT_NAME and the three SOPULI_TEST_*_PORT variables in that clone's
# environment; the suite reads the same four. The project name overrides `name:`
# below. Without a project name of its own, a second clone's `up` recreates the
# first clone's containers. See README.md.

name: sopuli-test

services:

  # ---------------------------------------------------------------- vault ---
  # Dev mode: in-memory, root token known, unsealed. Never resembles production,
  # which is the point — production auth paths are exercised against real OCI.
  vault:
    # Pinned rather than :latest: tests/store/test_hashicorp_cas_conflict.py
    # asserts on Vault's own error wording, so an upstream image bump has to
    # be a deliberate, reviewable line here -- not something that silently
    # changes what the regression test is measuring against.
    image: hashicorp/vault:2.0.4
    profiles: [tier0, tier1, tier2, nne]
    # No cap_add: [IPC_LOCK] here on purpose. 2.0.2 removed the cap_ipc_lock
    # capability at build time so Vault can run in common container runtimes
    # without it, with disable_mlock = true the advised setting instead --
    # carrying the capability request is obsolete, not merely unnecessary.
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: sopuli-test-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:${SOPULI_TEST_VAULT_PORT:-8200}:8200"
      - "[::1]:${SOPULI_TEST_VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mounts BOTH KV versions, so the store-capability degradation paths
  # (00-principles P2) are covered in one container.
  vault-init:
    image: hashicorp/vault:2.0.4
    profiles: [tier0, tier1, tier2, nne]
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: sopuli-test-root
    entrypoint:
      - sh
      - -c
      - |
        set -e
        vault secrets enable -path=kv   -version=2 kv || true
        vault secrets enable -path=kv1  -version=1 kv || true
        echo "kv (v2) and kv1 (v1) mounted"
    restart: "no"

  # ------------------------------------------------------------- postgres ---
  # Tier 0 driver work and the fast inner loop. Cheap enough to run a matrix.
  postgres:
    image: postgres:16-alpine
    profiles: [tier0, tier1, tier2]
    environment:
      POSTGRES_PASSWORD: sopuli-test
      POSTGRES_DB: sopuli
    ports:
      - "127.0.0.1:${SOPULI_TEST_POSTGRES_PORT:-5432}:5432"
      - "[::1]:${SOPULI_TEST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------- oracle ---
  # 23ai/26ai Free: CDB + PDB, common users, gradual password rollover.
  # The only Oracle a contributor can definitely pull, so tier 1 lives here and
  # the public suite must be green on it alone.
  oracle-free:
    image: gvenzl/oracle-free:latest
    profiles: [tier1, tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
      APP_USER: sopuli_probe
      APP_USER_PASSWORD: sopuli-test
    ports:
      - "127.0.0.1:${SOPULI_TEST_ORACLE_PORT:-1521}:1521"
      - "[::1]:${SOPULI_TEST_ORACLE_PORT:-1521}:1521"
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # 21c XE — an older CDB line.
  oracle-xe21:
    image: gvenzl/oracle-xe:21-slim
    profiles: [tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1522:1521", "[::1]:1522:1521"]
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # 18c XE — 12.2+ password lengths, no rollover. A useful negative case:
  # `--strategy rollover` must fail at plan time here, not at execution.
  oracle-xe18:
    image: gvenzl/oracle-xe:18-slim
    profiles: [tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1523:1521", "[::1]:1523:1521"]
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  # 11g XE — non-CDB, 30-byte passwords, 10G/11G verifiers, DBA_AUDIT_TRAIL.
  # Tag verified 2026-08-08 (04-testing.md T1): pulls, starts in ~15 s, accepts
  # the init profiles. Ships pre-built datafiles, so it is the FASTEST Oracle in
  # this stack, not the slowest — hence the short start_period.
  # Connects as SID XE, not a PDB service name. linux/amd64 only.
  oracle-xe11:
    image: gvenzl/oracle-xe:11.2.0.2-slim
    profiles: [tier2]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1524:1521", "[::1]:1524:1521"]
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ----------------------------------------------------- oracle 19c (#548) ---
  # 19.3.0.0.0 Enterprise Edition, Oracle's own prebuilt image. MAINTAINER-ONLY:
  # pulling it takes an Oracle account, the licence accepted for the
  # database/enterprise repository, and `docker login container-registry.oracle.com`
  # -- see docs/maintainer-environments.md. It cannot be redistributed, so it never runs in
  # CI and the suite skips rather than fails without it.
  #
  # Profile `oracle19c`, not `tier3`: tier 3 is the whole maintainer matrix
  # (04-testing.md §2), most of which is real cloud services no compose file can
  # start, so `--profile tier3` would promise something this file cannot keep.
  # A profile named for the one licence-gated service also means nothing that
  # already exists pulls it by accident. It carries no vault/postgres; combine
  # it with `--profile tier1` when a run needs the vault.
  #
  # 19.3 is the base release: it has no gradual password rollover (19.12+), and
  # an OCI estate runs a later RU. Record results as 19.3.0.0.0, never "19c".
  #
  # The one service here WITH a volume, because first start runs DBCA and takes
  # tens of minutes (docs/maintainer-environments.md). `down` keeps the volume;
  # `down -v` throws the database away and the next `up` creates it again.
  # Init: the same oracle-init/01_test_profiles.sql as tier 2, run once after
  # DBCA -- but inside ORCLPDB1 rather than CDB$ROOT, through the wrapper in
  # oracle-init-19c/. This image keeps COMMON_USER_PREFIX = C##, so SOPULI_*
  # cannot be a common profile here (ORA-65140); the wrapper says why.
  oracle-19c:
    # sha256:2df7530ac81566f8659e13d41fda029e5c08a983147e5b372b173476a74ab62e
    # (pulled 2026-09-26)
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    profiles: [oracle19c]
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: sopuli-test
    ports: ["127.0.0.1:1526:1521", "[::1]:1526:1521"]
    volumes:
      - oracle19c-data:/opt/oracle/oradata
      - ./oracle-init:/opt/sopuli/oracle-init:ro
      - ./oracle-init-19c:/opt/oracle/scripts/setup:ro
    healthcheck:
      # The image's own check: database role PRIMARY and a PDB open READ WRITE.
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 3600s

  # ------------------------------------------- oracle 19.19 (#565, closed) ---
  # 19.19.0.0.0 Enterprise Edition, from the same registry repository and on the
  # same terms as oracle-19c above: maintainer-only, never in CI. The one pullable
  # 19c past 19.12, so the one that can open a gradual-rollover window.
  #
  # THE TAG IS linux/arm64 ONLY, AND IT NEEDS AN arm64 HOST. The manifest is a
  # single-platform one, not a list with an amd64 entry (checked 2026-09-28), and
  # the build label is RDBMS_19.19.0.0.0DBRU_LINUX.ARM64. Under Docker Desktop's
  # QEMU emulation on x86 it does not start: DBCA dies at 9% with ORA-00443,
  # and the PMON trace says ORA-01096: program version (19.0.0.0.0) incompatible
  # with instance (0.0.0.14.238) -- measured 2026-09-28, two minutes in. That is
  # emulation failing, not slowness, so waiting longer does not help.
  #
  # `platform:` makes the requirement explicit rather than leaving it to a pull
  # warning. On an arm64 host such as Apple Silicon it should run natively; that
  # is untested, the service is written by analogy with oracle-19c above, and no
  # issue tracks it since #565 closed in favour of an OCI DB system (#581).
  # Record results as 19.19.0.0.0 on arm64.
  #
  # Its own profile rather than oracle19c's: two EE instances do not fit side by
  # side in the maintainer's 7.7 GB Docker Desktop, so `--profile oracle19c` must
  # not start both. Same init wrapper, same C## prefix, own port and volume.
  #
  # `--profile oracle19c-ru down -v` removes this volume and leaves oracle-19c's:
  # compose scopes `-v` to the selected profile's services (checked 2026-09-28
  # with a scratch two-profile project). `--profile '*' down -v` takes both.
  oracle-19c-ru:
    # sha256:3843234f6fd1ed084b1dd7ad42eeeaa95ad13f12c790810cb368bb58f8ad42ba
    # (image created 2024-12-11; pulled before 2026-09-28)
    image: container-registry.oracle.com/database/enterprise:19.19.0.0
    platform: linux/arm64
    profiles: [oracle19c-ru]
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: sopuli-test
    ports: ["127.0.0.1:1527:1521", "[::1]:1527:1521"]
    volumes:
      - oracle19c-ru-data:/opt/oracle/oradata
      - ./oracle-init:/opt/sopuli/oracle-init:ro
      - ./oracle-init-19c:/opt/oracle/scripts/setup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 3600s

  # ----------------------------------------------------- oracle 12.2 (#572) ---
  # 12.2.0.1 Enterprise Edition, Oracle's own prebuilt "-slim" image, on the same
  # terms as oracle-19c: maintainer-only, never in CI, pulled after `docker login
  # container-registry.oracle.com` with the licence accepted. The only 12.x the
  # stack can start; 12.1 stays unmeasured.
  #
  # A much older image than the 19c ones (built 2017-08-17), and it differs in
  # every knob:
  #   - DB_SID / DB_PDB / DB_PASSWD, not ORACLE_SID / ORACLE_PDB / ORACLE_PWD;
  #   - no DBCA: first start untars prebuilt datafiles into /ORCL, so it is
  #     minutes rather than tens of minutes;
  #   - service names carry DB_DOMAIN, default `localdomain`, so the PDB is
  #     ORCLPDB1.localdomain and a bare ORCLPDB1 is ORA-12514;
  #   - NO user-script hook. oracle-init-12c/init.sh is run once, by hand, with
  #     the docker exec in docs/maintainer-environments.md: it writes a password file the
  #     image's own setup refused to (OPW-00029 -- `sopuli-test` has no digit),
  #     creates the USERS tablespace this image's root lacks, and applies the
  #     test profiles in the PDB;
  #   - a WE8DEC database, not AL32UTF8 -- the only non-Unicode one in the stack.
  #
  # The volume is /ORCL, the image's own: setupDB.sh finds the datafiles there
  # on a recreated container and starts the existing database instead of
  # untarring a new one. Record results as 12.2.0.1.0, never "12c".
  oracle-12c:
    # sha256:68dbe7251bddcc3d70827845bcdc8687eef66471e6e8ea37419eb73f61e4748b
    # (image created 2017-08-17; pulled 2026-09-29)
    image: container-registry.oracle.com/database/enterprise:12.2.0.1-slim
    profiles: [oracle12c]
    environment:
      DB_SID: ORCLCDB
      DB_PDB: ORCLPDB1
      DB_PASSWD: sopuli-test
      # The image sets ORACLE_HOME but not these two -- its scripts get them from
      # ~/.bashrc, which `docker exec` does not read. Without them the suite's
      # `docker exec <container> sqlplus` finds no sqlplus, and `/ as sysdba`
      # attaches to SID ORCL, which does not exist.
      ORACLE_SID: ORCLCDB
      PATH: /u01/app/oracle/product/12.2.0/dbhome_1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports: ["127.0.0.1:1528:1521", "[::1]:1528:1521"]
    volumes:
      - oracle12c-data:/ORCL
      - ./oracle-init:/opt/sopuli/oracle-init:ro
      - ./oracle-init-12c:/opt/sopuli/oracle-init-12c:ro
    healthcheck:
      # Three conditions, so that `healthy` means ready for the suite:
      #   - the image's own check, V$INSTANCE.STATUS = OPEN;
      #   - the PDB's service registered. The image starts the listener after
      #     the database, so the instance is OPEN about a minute before PMON's
      #     next registration and a client meanwhile gets ORA-12514 -- measured
      #     2026-09-29, "The listener supports no services" with the PDB READ WRITE;
      #   - oracle-init-12c/init.sh has completed, which it marks in the /ORCL
      #     volume as its last step. Until then this stays `starting`, and turns
      #     `unhealthy` once start_period is spent -- the signal to run it.
      test: ["CMD-SHELL", "test -f /ORCL/.sopuli-init-12c-done && /bin/bash /home/oracle/setup/healthcheck.sh && lsnrctl status | grep -qi 'Service \"orclpdb1'"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 1800s

  # ------------------------------------------------------------------ NNE ---
  # Approximates the OCI constraint locally: the server REQUIRES Native Network
  # Encryption, so a thin-mode connection must fail with DPY-3001. This covers the
  # failure path and the diagnostics; the success path still needs real OCI.
  oracle-nne:
    image: gvenzl/oracle-free:latest
    profiles: [nne]
    environment:
      ORACLE_PASSWORD: sopuli-test
    ports: ["127.0.0.1:1525:1521", "[::1]:1525:1521"]
    volumes:
      - ./oracle-init/sqlnet-nne.ora:/opt/oracle/oradata/dbconfig/FREE/sqlnet.ora:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # ------------------------------------------------- emulators (smoke only) --
  # Never authoritative. A green run here is "the code path executes", nothing
  # more; the real services are the release evidence. There is no AWS emulator
  # here: LocalStack's image needs an account token (T3).
  lowkey-vault:
    image: nagyesta/lowkey-vault:latest
    profiles: [emulators]
    ports: ["127.0.0.1:8443:8443", "[::1]:8443:8443"]

volumes:
  # Only the two 19c services and 12.2 keep their datafiles; see oracle-19c for why.
  oracle19c-data:
  oracle19c-ru-data:
  oracle12c-data:
