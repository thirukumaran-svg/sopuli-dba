name: release-please

# Maintains a standing release PR against main: accumulated changelog plus the
# version bump. Merging that PR is the explicit act that cuts the tag and the
# GitHub Release — nothing here tags directly. See docs/workflow.md.
#
# The same merge then builds the distributions and publishes them to PyPI
# (#545). Both are jobs here rather than a separate workflow on
# `release: published`, because release-please creates the Release with this
# workflow's GITHUB_TOKEN, and GitHub starts no workflow run for an event that
# token caused -- a separate workflow would silently never run. On every push
# that cuts no release, `build` and `publish` show as skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing at the top level; each job asks for exactly what it uses.
permissions: {}

# A push landing while a previous run is still open would otherwise race on the
# release PR. Never cancel in progress: a cancelled run can leave the PR stale.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Separate from `build` on purpose: the PEP 740 attestation this job produces
  # vouches for the files `build` handed over, and this job holds the one
  # credential -- a short-lived OIDC token PyPI trusts -- and nothing else.
  # The `pypi` environment's required reviewers are the last point at which a
  # release can be stopped.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sopuli-dba
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # Attestations are on by default from v1.11; do not set `attestations: false`.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
