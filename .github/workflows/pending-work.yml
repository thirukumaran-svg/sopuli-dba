name: pending-work

# Compares what the repository says about issues with what GitHub says.
#
# * A `TODO(#N)` or `(open: #N)` marker names an open issue (#614). The marker
#   means "this waits on #N", so once #N closes the text beside it is probably
#   wrong. `tests/test_pending_work.py` finds the markers.
# * The decision register in `docs/README.md` agrees with issue states, and every
#   open `decision` issue has a row (#615). `tests/test_decision_register.py`
#   reads the register.
#
# Weekly and on demand, not on pull requests: it needs the network, and an issue
# closes without any pull request touching the files that name it.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  markers:
    name: markers and the decision register match issue states
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: markers and the register match GitHub
        env:
          SOPULI_CHECK_ISSUES: "1"
          GH_TOKEN: ${{ github.token }}
        run: pytest tests/test_pending_work.py tests/test_decision_register.py -k "closed_issue or issue_has_a_row or matches_its_issue"
